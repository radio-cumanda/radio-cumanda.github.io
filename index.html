<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>RADIO CUMANDA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Fondo de playa en movimiento */
        .fondo-playa {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            background-image: url('https://i.imgur.com/your-beach-image.jpg');
            background-size: cover;
            background-position: center;
            animation: moverFondo 20s ease-in-out infinite alternate;
        }

        @keyframes moverFondo {
            0% {
                transform: scale(1) translate(0, 0);
                filter: brightness(1) contrast(1);
            }
            50% {
                transform: scale(1.05) translate(-10px, -10px);
                filter: brightness(1.1) contrast(1.05);
            }
            100% {
                transform: scale(1.08) translate(10px, 10px);
                filter: brightness(1) contrast(1);
            }
        }

        /* Capa oscura para que se lea bien el texto */
        .capa-oscura {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: rgba(0, 0, 0, 0.55);
        }

        .contenedor {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* Círculo RC */
        .circulo {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: white;
            border: 4px solid #ffcd00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 900;
            color: #002f5f;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 25px;
        }

        /* Imagen principal */
        .imagen-principal {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #ffcd00;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 25px;
        }

        h1 {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        .eslogan {
            font-size: 22px;
            color: #ffcd00;
            margin-bottom: 35px;
        }

        .reproductor {
            background: rgba(255, 255, 255, 0.95);
            color: #002f5f;
            width: 100%;
            max-width: 520px;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
        }

        .reproductor audio {
            width: 100%;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .circulo {
                width: 180px;
                height: 180px;
                font-size: 38px;
            }

            .imagen-principal {
                width: 150px;
                height: 150px;
            }

            h1 {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="fondo-playa"></div>
    <div class="capa-oscura"></div>

    <div class="contenedor">
        <div class="circulo">RC</div>

        <img src="https://i.imgur.com/your-radio-studio-image.jpg" class="imagen-principal" alt="Radio Cumanda">

        <h1>RADIO CUMANDA</h1>
        <p class="eslogan">Uniendo familias</p>

        <div class="reproductor">
            <audio controls autoplay preload="none">
                <source src="https://stream.zeno.fm/yjbulgm54cwtv" type="audio/mpeg">
                Tu navegador no soporta la reproducción de audio.
            </audio>
            <p>✅ Transmisión en vivo</p>
        </div>
    </div>
</body>
</html>
