<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADIO CUMANDA</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Segoe UI',sans-serif;
            color:#fff;
            min-height:100vh;
            overflow:hidden;
            position:relative;
        }

        /* Fondo de playa en movimiento */
        .fondo-playa{
            position:absolute;
            top:0;left:0;
            width:100%;height:100%;
            z-index:-3;
            background-image:url('playa.jpg');
            background-size:cover;
            background-position:center;
            animation:moverFondo 18s ease-in-out infinite alternate;
        }
        @keyframes moverFondo{
            0%{transform:scale(1) translate(0,0)}
            100%{transform:scale(1.08) translate(10px,8px)}
        }

        .sombra{
            position:absolute;
            top:0;left:0;
            width:100%;height:100%;
            background:rgba(0,0,0,.55);
            z-index:-2;
        }

        .centro{
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            padding:20px;
            text-align:center;
        }

        /* Círculo RC */
        .circulo{
            width:200px;height:200px;
            border-radius:50%;
            background:#fff;
            border:4px solid #ffd700;
            color:#002f5f;
            font-size:60px;
            font-weight:900;
            display:flex;
            align-items:center;
            justify-content:center;
            margin-bottom:20px;
            box-shadow:0 8px 25px rgba(0,0,0,.3);
        }

        /* Imagen del estudio */
        .imagen-estudio{
            width:180px;
            height:180px;
            border-radius:50%;
            border:4px solid #ffd700;
            object-fit:cover;
            margin-bottom:20px;
            box-shadow:0 8px 25px rgba(0,0,0,.3);
        }

        h1{font-size:48px;margin-bottom:10px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
        .frase{font-size:22px;color:#ffd700;margin-bottom:30px}

        .reproductor{
            background:#fff;
            color:#002f5f;
            padding:30px;
            border-radius:24px;
            width:100%;
            max-width:500px;
            box-shadow:0 10px 30px rgba(0,0,0,.3);
        }
        .reproductor audio{width:100%;margin-bottom:12px;display:block}
        .reproductor p{color:#555;font-size:15px}

        @media(max-width:600px){
            .circulo{width:160px;height:160px;font-size:45px}
            .imagen-estudio{width:150px;height:150px}
            h1{font-size:32px}
        }
    </style>
</head>
<body>
    <div class="fondo-playa"></div>
    <div class="sombra"></div>

    <div class="centro">
        <div class="circulo">RC</div>
        <img src="estudio.jpg" class="imagen-estudio" alt="Estudio Radio Cumanda">
        <h1>RADIO CUMANDA</h1>
        <p class="frase">Uniendo familias</p>

        <div class="reproductor">
            <audio controls preload="none">
                <source src="https://stream.zeno.fm/yjbulgm54cwtv" type="audio/mpeg">
                Tu navegador no soporta la reproducción de audio.
            
            <p>🔊 Pulsa ▶ para escuchar en vivo</p>
        </div>
    </div>
</body>
</html>
